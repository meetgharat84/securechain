<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="scShieldBg" x1="24" y1="2" x2="24" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2d554d" />
      <stop offset="100%" stop-color="#142c27" />
    </linearGradient>

    <!-- Edge / Border Gradient -->
    <linearGradient id="scShieldStroke" x1="10" y1="4" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5fa899" />
      <stop offset="50%" stop-color="#37675d" />
      <stop offset="100%" stop-color="#19352e" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="scAccentGrad" x1="16" y1="14" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <filter id="scGlow" x="14" y="14" width="20" height="20" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Silhouette -->
  <path
    d="M24 4.5L39 10.8C39 24.5 32.8 37 24 43.5C15.2 37 9 24.5 9 10.8L24 4.5Z"
    fill="url(#scShieldBg)"
    stroke="url(#scShieldStroke)"
    stroke-width="1.75"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Shield Inset Line -->
  <path
    d="M24 8L36.2 13.2C36.2 24.2 31 34.6 24 39.8C17 34.6 11.8 24.2 11.8 13.2L24 8Z"
    fill="none"
    stroke="#478578"
    stroke-width="0.75"
    stroke-opacity="0.45"
  />

  <!-- Cryptographic Blockchain Links (Interlocking Hex/Chain Geometry) -->
  <!-- Upper Chain Link -->
  <path
    d="M19.5 17C17.5 17 16 18.6 16 20.6C16 22.6 17.5 24.2 19.5 24.2H23C23.6 24.2 24 23.7 24 23.2C24 22.6 23.6 22.2 23 22.2H19.5C18.6 22.2 18 21.5 18 20.6C18 19.7 18.6 19 19.5 19H24.5V17H19.5Z"
    fill="url(#scAccentGrad)"
  />

  <!-- Lower Chain Link -->
  <path
    d="M28.5 31C30.5 31 32 29.4 32 27.4C32 25.4 30.5 23.8 28.5 23.8H25C24.4 23.8 24 24.3 24 24.8C24 25.4 24.4 25.8 25 25.8H28.5C29.4 25.8 30 26.5 30 27.4C30 28.3 29.4 29 28.5 29H23.5V31H28.5Z"
    fill="url(#scAccentGrad)"
  />

  <!-- Connecting Interlock Bar -->
  <rect x="22.5" y="19.5" width="3" height="9" rx="1.5" fill="url(#scAccentGrad)" fill-opacity="0.85" />

  <!-- Central Formal Verification Core (Rotated Diamond) -->
  <rect
    x="21.5"
    y="21.5"
    width="5"
    height="5"
    rx="1"
    transform="rotate(45 24 24)"
    fill="#ffffff"
    stroke="#5eead4"
    stroke-width="1.2"
    filter="url(#scGlow)"
  />

  <!-- Verification Pulse Dot in Apex -->
  <circle cx="24" cy="11.5" r="1.5" fill="#5eead4" />
</svg>
